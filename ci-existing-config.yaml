# CI-only structure mirror of the existing powerpal-proxy YAML.
# Placeholder credentials, test-net address and sample meter values.
# DO NOT deploy this fixture.
esphome:
  name: powerpal-proxy
  friendly_name: powerpal-proxy

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
      flash_chip: generic

logger:

api:
  encryption:
    key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: "CI-ONLY-SSID"
  password: "ci-only-wifi-password"
  fast_connect: true
  min_auth_mode: WPA2
  power_save_mode: none
  reboot_timeout: 0s
  manual_ip:
    static_ip: 192.0.2.40
    gateway: 192.0.2.1
    subnet: 255.255.255.0
    dns1: 192.0.2.1

external_components:
  - source:
      type: local
      path: components
    components: [powerpal_ble]

time:
  - platform: homeassistant
    id: homeassistant_time

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 110ms
    active: false

ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"
    id: powerpal

sensor:
  - platform: powerpal_ble
    ble_client_id: powerpal
    pairing_code: 123456
    notification_interval: 5
    pulses_per_kwh: 3200
    time_id: homeassistant_time
    power:
      name: "Powerpal Power"
    daily_energy:
      name: "Powerpal Daily Energy"
    energy:
      name: "Powerpal Total Energy"
    battery_level:
      name: "Powerpal Battery"

web_server:
  port: 80
  auth:
    type: digest
    username: "ci-only-user"
    password: "ci-only-password"

button:
  - platform: restart
    name: "Powerpal Restart"
  - platform: factory_reset
    name: "Powerpal Reset NVS"
    entity_category: diagnostic
