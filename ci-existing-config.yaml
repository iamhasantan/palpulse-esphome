# CI-only structure mirror of the hardware-generic README 1.0 configuration.
# Placeholder credentials and test meter; DO NOT deploy this fixture.
# Use a local component source here so the PR can validate before tag 1.0 exists.
esphome:
  name: powerpal-proxy
  friendly_name: powerpal-proxy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  reboot_timeout: 0s
  homeassistant_services: true
  custom_services: true

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: "CI-ONLY-SSID"
  password: "ci-only-wifi-password"
  fast_connect: true
  min_auth_mode: WPA2
  power_save_mode: none
  reboot_timeout: 0s

external_components:
  - source:
      type: local
      path: components
    components: [powerpal_ble]

time:
  - platform: homeassistant
    id: homeassistant_time

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 110ms
    active: false

ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"
    id: powerpal

sensor:
  - platform: powerpal_ble
    ble_client_id: powerpal
    history_events: true
    reliable_history: true
    pairing_code: 123456
    notification_interval: 5
    pulses_per_kwh: 3200
    time_id: homeassistant_time

    power:
      name: "Powerpal Power"

    daily_energy:
      name: "Powerpal Daily Energy"

    energy:
      name: "Powerpal Total Energy"

    battery_level:
      name: "Powerpal Battery"
